<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fees - Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <div class="brand-text">My<br>Portal</div>
    </div>
    <nav class="sidebar-nav">
      <a href="student-dashboard.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="student-attendance.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="nav-label">Attendance</span>
      </a>
      <a href="student-marks.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="nav-label">Marks</span>
      </a>
      <a href="student-fees.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span class="nav-label">Fees</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <div class="page">

      <header class="topbar">
        <div class="topbar-heading">
          <h1>Fees</h1>
          <p class="subtitle">Your total fee, amount paid and due status</p>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggleBtn" type="button" title="Toggle dark mode"></button>
        </div>
      </header>

      <main class="content">

        <div class="error-banner" id="errorBanner" hidden></div>
        <div class="success-banner" id="paidBanner" hidden>Your fees are fully paid. No dues pending.</div>

        <div class="summary-cards">
          <div class="summary-card">
            <div class="value" id="feeTotal">Rs 0</div>
            <div class="label">Total Fee</div>
          </div>
          <div class="summary-card">
            <div class="value" id="feePaid">Rs 0</div>
            <div class="label">Paid</div>
          </div>
          <div class="summary-card">
            <div class="value" id="feeDue">Rs 0</div>
            <div class="label">Due</div>
          </div>
          <div class="summary-card">
            <div class="value" id="feeStatus"><span class="badge badge-neutral">-</span></div>
            <div class="label">Status</div>
          </div>
        </div>

        <div class="chart-grid" style="grid-template-columns: 1.2fr 1fr;">
          <section class="fee-panel">
            <h3>Payment Progress</h3>
            <p class="fee-sub" id="feeProgressSub">-</p>
            <div class="fee-progress-track">
              <div class="fee-progress-fill" id="feeProgressFill"></div>
            </div>
            <div class="fee-progress-label">
              <span id="feeProgressPercent">0% paid</span>
              <span id="feeProgressDue">Rs 0 due</span>
            </div>
          </section>
          <div class="chart-card"><h3>Paid vs Due</h3><canvas id="chartFees"></canvas></div>
        </div>

      </main>
    </div>
  </div>
</div>

<script>window.LOGIN_PAGE = "student-login.html";</script>
<script src="vendor/chart.umd.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script src="js/student-fees.js"></script>
</body>
</html>
