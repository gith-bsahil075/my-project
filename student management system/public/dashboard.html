<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 7l11 5 9-4.09V17h2V7L12 2zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <div class="brand-text">Student<br>Management</div>
    </div>
    <nav class="sidebar-nav">
      <a href="home.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="dashboard.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Students</span>
      </a>
      <a href="attendance.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span class="nav-label">Attendance</span>
      </a>
      <a href="marks.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="nav-label">Marks</span>
      </a>
      <a href="fees.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span class="nav-label">Fees</span>
      </a>
      <a href="settings.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-logout" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <div class="page">

      <header class="topbar">
        <div class="topbar-heading">
          <h1>Students</h1>
          <p class="subtitle">Add, search, update and remove student records</p>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggleBtn" type="button" title="Toggle dark mode"></button>
          <div class="topbar-stat">
            <span class="stat-number" id="studentCount">0</span>
            <span class="stat-label">students</span>
          </div>
        </div>
      </header>

      <main class="content">

        <div class="toolbar">
          <button class="btn btn-primary" id="openAddFormBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Student
          </button>
          <button class="btn btn-ghost" id="exportPdfBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Export PDF
          </button>
          <button class="btn btn-ghost" id="exportExcelBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            Export Excel
          </button>
          <div class="error-banner" id="errorBanner" hidden></div>
        </div>

        <section class="form-panel" id="formPanel" hidden>
          <h2 id="formTitle">Add Student</h2>
          <form id="studentForm">
            <div class="photo-upload-row">
              <img id="photoPreview" class="photo-preview" alt="Profile photo preview" hidden>
              <div class="photo-preview-placeholder" id="photoPlaceholder">No Photo</div>
              <label class="btn btn-ghost btn-small photo-upload-btn">
                Choose Photo
                <input type="file" id="fieldPhoto" accept="image/*" hidden>
              </label>
            </div>
            <div class="field-grid">
              <label class="field">
                <span>Name</span>
                <input type="text" id="fieldName" name="name" placeholder="e.g. Sahil Sharma" required>
              </label>
              <label class="field">
                <span>Age</span>
                <input type="number" id="fieldAge" name="age" min="1" max="100" placeholder="e.g. 21" required>
              </label>
              <label class="field">
                <span>Course</span>
                <input type="text" id="fieldCourse" name="course" placeholder="e.g. CSE (AI/ML)" required>
              </label>
              <label class="field">
                <span>CGPA</span>
                <input type="number" id="fieldCgpa" name="cgpa" min="0" max="10" step="0.01" placeholder="e.g. 8.20" required>
              </label>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submitBtn">Save Student</button>
              <button type="button" class="btn btn-ghost" id="cancelFormBtn">Cancel</button>
            </div>
          </form>
        </section>

        <section class="table-section">
          <div class="table-toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="searchBox" placeholder="Search by name or ID...">
            </div>
            <select class="filter-select" id="courseFilter">
              <option value="">All Courses</option>
            </select>
          </div>

          <table class="student-table">
            <thead>
              <tr>
                <th class="col-photo"></th>
                <th class="col-id sortable" data-sort="id">ID <span class="sort-arrow" data-arrow="id"></span></th>
                <th class="sortable" data-sort="name">Name <span class="sort-arrow" data-arrow="name"></span></th>
                <th class="col-age sortable" data-sort="age">Age <span class="sort-arrow" data-arrow="age"></span></th>
                <th>Course</th>
                <th class="col-cgpa sortable" data-sort="cgpa">CGPA <span class="sort-arrow" data-arrow="cgpa"></span></th>
                <th class="col-portal">Portal Login</th>
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>

          <div class="empty-state" id="emptyState" hidden>
            <p>No students yet.</p>
            <p class="empty-sub">Click "Add Student" to add the first record.</p>
          </div>

          <div class="pagination" id="pagination" hidden>
            <span id="paginationInfo"></span>
            <div class="pagination-controls" id="paginationControls"></div>
          </div>
        </section>

      </main>
    </div>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/toast.js"></script>
<script src="js/confirm-modal.js"></script>
<script src="js/theme.js"></script>
<script src="js/common.js"></script>
<script src="js/students.js"></script>
</body>
</html>
